# Generated project: run `xcodegen` after changing this file, and commit
# GarminSmartwatchKit.xcodeproj too, so hosts can add it without xcodegen.
name: GarminSmartwatchKit
options:
  bundleIdPrefix: org.loopkit
  deploymentTarget:
    iOS: "17.6"
  createIntermediateGroups: true
packages:
  ConnectIQ:
    url: https://github.com/garmin/connectiq-companion-app-sdk-ios
    from: 1.8.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: YES
targets:
  GarminSmartwatchKit:
    type: framework
    platform: iOS
    sources: [GarminSmartwatchKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.loopkit.GarminSmartwatchKit
        SKIP_INSTALL: YES
        ENABLE_MODULE_VERIFIER: NO
        INSTALL_PATH: "$(LOCAL_LIBRARY_DIR)/Frameworks"
        LD_RUNPATH_SEARCH_PATHS: ""
    dependencies:
      - framework: LoopKit.framework
        implicit: true
        embed: false
      - package: ConnectIQ
        embed: false
  GarminSmartwatchKitUI:
    type: framework
    platform: iOS
    sources: [GarminSmartwatchKitUI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.loopkit.GarminSmartwatchKitUI
        SKIP_INSTALL: YES
        ENABLE_MODULE_VERIFIER: NO
        INSTALL_PATH: "$(LOCAL_LIBRARY_DIR)/Frameworks"
        LD_RUNPATH_SEARCH_PATHS: ""
    dependencies:
      - target: GarminSmartwatchKit
        embed: false
      - framework: LoopKit.framework
        implicit: true
        embed: false
      - framework: LoopKitUI.framework
        implicit: true
        embed: false
      - package: ConnectIQ
        embed: false
  GarminSmartwatchPlugin:
    type: bundle
    platform: iOS
    sources: [GarminSmartwatchPlugin]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.loopkit.GarminSmartwatchPlugin
        INFOPLIST_FILE: GarminSmartwatchPlugin/Info.plist
        WRAPPER_EXTENSION: loopplugin
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: ""
    dependencies:
      - target: GarminSmartwatchKit
      - target: GarminSmartwatchKitUI
      - package: ConnectIQ
      - framework: LoopKit.framework
        implicit: true
        embed: false
      - framework: LoopKitUI.framework
        implicit: true
        embed: false
  GarminSmartwatchKitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GarminSmartwatchKitTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.loopkit.GarminSmartwatchKitTests
    dependencies:
      - target: GarminSmartwatchKit
      - framework: LoopKit.framework
        implicit: true
        embed: false
schemes:
  GarminSmartwatchKit:
    build:
      targets:
        GarminSmartwatchKit: all
        GarminSmartwatchKitUI: all
        GarminSmartwatchPlugin: all
    test:
      targets: [GarminSmartwatchKitTests]
